<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">UUBOYSCY favicon</title>
  <desc id="desc">A compact U-shaped code-bracket mark.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172235"/>
      <stop offset="1" stop-color="#0d3037"/>
    </linearGradient>
    <linearGradient id="mark" x1="250" y1="210" x2="790" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55e59b"/>
